<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Lanchana Ganesh Naik — Junior Software Engineer building production web and mobile apps with React.js, React Native and TypeScript across fintech, civic-tech, agriculture and events."

    <meta name="theme-color" content="#F4F2ED" media="(prefers-color-scheme: light)" />

      property="og:description"

    />
    <meta property="og:type" content="website" />

    <!-- Apply the saved / system colour scheme before first paint (no flash). -->
    <script>
      (function () {
        var mode = 'light'
        try {
          var saved = localStorage.getItem('ln-theme')
          if (saved === 'light' || saved === 'dark') mode = saved
          else if (window.matchMedia('(prefers-color-scheme: dark)').matches) mode = 'dark'
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', mode)
      })()
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="preload" as="image" href="/assets/lanchana-portrait.jpg" fetchpriority="high" />
